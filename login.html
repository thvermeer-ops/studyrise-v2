<!doctype html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyRise — Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: #0a0a0a;
        color: #f0f0f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .card {
        background: #111;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 40px 36px;
        width: 100%;
        max-width: 400px;
      }
      h1 {
        font-size: 1.4rem;
        font-weight: 700;
        margin-bottom: 8px;
      }
      p {
        color: #888;
        font-size: 0.9rem;
        margin-bottom: 28px;
      }
      input {
        background: #1a1a1a;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 12px 14px;
        color: #f0f0f0;
        font-size: 0.9rem;
        width: 100%;
        margin-bottom: 10px;
        outline: none;
        font-family: inherit;
      }
      input:focus {
        border-color: #2563eb;
      }
      button {
        background: #2563eb;
        color: #fff;
        border: none;
        border-radius: 8px;
        padding: 12px;
        font-size: 0.9rem;
        font-weight: 600;
        width: 100%;
        cursor: pointer;
        margin-bottom: 8px;
        font-family: inherit;
      }
      button:hover {
        background: #1d4ed8;
      }
      .error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.2);
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 0.82rem;
        color: #f87171;
        margin-bottom: 12px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Welcome to StudyRise 👋</h1>
      <p>Sign in to access your homework planner</p>
      <div class="error" id="errorMsg"></div>
      <button
        onclick="signInWithGoogle()"
        style="
          background: #1a1a1a;
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #f0f0f0;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          margin-bottom: 16px;
        "
      >
        <svg width="20" height="20" viewBox="0 0 24 24">
          <path
            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
            fill="#4285F4"
          />
          <path
            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
            fill="#34A853"
          />
          <path
            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
            fill="#FBBC05"
          />
          <path
            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
            fill="#EA4335"
          />
        </svg>
        Continue with Google
      </button>
      <div
        style="
          text-align: center;
          color: #444;
          font-size: 0.8rem;
          margin-bottom: 16px;
        "
      >
        or
      </div>
      <input type="email" id="emailInput" placeholder="Email address" />
      <input type="password" id="passwordInput" placeholder="Password" />
      <button onclick="signIn()">Sign in</button>
      <button
        onclick="signUp()"
        style="
          background: #1a1a1a;
          border: 1px solid rgba(255, 255, 255, 0.1);
          color: #f0f0f0;
        "
      >
        Create account
      </button>
    </div>
    <script>
      const SUPABASE_URL = "https://tnvdybovafzwryrwdfup.supabase.co";
      const SUPABASE_KEY = "sb_publishable_5yIF13i4hDxgGKixbb8JYw_AR2PcuZG";
      const _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      async function signIn() {
        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        if (!email || !password) {
          showError("Please fill in all fields");
          return;
        }
        const { error } = await _sb.auth.signInWithPassword({
          email,
          password,
        });
        if (error) {
          showError(error.message);
          return;
        }
        localStorage.setItem("sr_user", email);
        window.location.href = "app-v2.html";
      }

      async function signUp() {
        const email = document.getElementById("emailInput").value.trim();
        const password = document.getElementById("passwordInput").value;
        if (!email || !password) {
          showError("Please fill in all fields");
          return;
        }
        if (password.length < 6) {
          showError("Password must be at least 6 characters");
          return;
        }
        const { error } = await _sb.auth.signUp({ email, password });
        if (error) {
          showError(error.message);
          return;
        }
        localStorage.setItem("sr_user", email);
        showError("✅ Account created! You can now sign in.");
      }
      function showError(msg) {
        const el = document.getElementById("errorMsg");
        el.style.display = "block";
        el.textContent = msg;
      }

      async function checkSession() {
        const {
          data: { session },
        } = await _sb.auth.getSession();
        if (session) {
          localStorage.setItem("sr_user", session.user.email);
          window.location.href =
            "https://thvermeer-ops.github.io/studyrise-v2/app-v2.html";
        }
      }
      checkSession();
      async function signInWithGoogle() {
        const { error } = await _sb.auth.signInWithOAuth({
          provider: "google",
          options: {
            redirectTo:
              window.location.origin +
              "/https://thvermeer-ops.github.io/studyrise-v2/app-v2.html",
          },
        });
        if (error) showError(error.message);
      }
    </script>
  </body>
</html>
